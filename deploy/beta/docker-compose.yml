
services:
  topospace-runtime:
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile
    ports: ["8788:8788"]
    environment:
      PORT: "8788"
      TOPOSPACE_API_KEY_ID: ${TOPOSPACE_API_KEY_ID:-}
      TOPOSPACE_API_KEY_SECRET: ${TOPOSPACE_API_KEY_SECRET:-}
      TORUSDB_URL: ${TORUSDB_URL:-}
      TORUSDB_API_KEY: ${TORUSDB_API_KEY:-}
