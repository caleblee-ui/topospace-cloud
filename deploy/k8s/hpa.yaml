
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: topospace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: topospace
  minReplicas: 3
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
