[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topospace"
version = "1.3.0b1"
description = "Provider-neutral AI execution optimization plane for context, model, path, and budget control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [{name = "TopoSpace contributors"}]
keywords = ["ai", "agents", "topology", "context", "routing", "gateway", "optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: Other/Proprietary License",
]
dependencies = ["uvicorn>=0.30,<1"]

[project.urls]
Homepage = "https://j1729labs.site/topospace"
Repository = "https://github.com/caleblee-ui/topospace-cloud"
Documentation = "https://github.com/caleblee-ui/topospace-cloud#readme"
Issues = "https://github.com/caleblee-ui/topospace-cloud/issues"
License = "https://polyformproject.org/licenses/noncommercial/1.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["build*", "tests*", "benchmarks*", "docs*", "examples*", "release*", "results*", "studio*", "npm*", "web-sdk*"]
