<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopoSpace Studio v0.5</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#0b0f14;color:#e8eef6;display:grid;grid-template-columns:280px 1fr 340px;height:100vh}aside{padding:18px;border-right:1px solid #27303a;background:#10161e}.right{border-left:1px solid #27303a;border-right:0}main{position:relative;overflow:hidden}h1{font-size:18px;margin:0 0 5px}.muted{color:#8fa2b7;font-size:12px}.badge{display:inline-block;padding:3px 7px;border:1px solid #34414e;border-radius:999px;font-size:11px;margin:2px}.timeline{margin-top:20px}.step{padding:9px;margin:6px 0;border:1px solid #27303a;border-radius:8px;cursor:pointer;font-size:12px}.step.active{background:#18222d}.metric{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:12px;margin-top:10px}svg{width:100%;height:100%}.edge{stroke:#536274;stroke-opacity:.5}.node circle{stroke:#dbe6f2}.node text{fill:#dbe6f2;font-size:11px}.inactive{opacity:.12}.topbar{position:absolute;left:16px;top:14px;background:#10161edd;border:1px solid #27303a;border-radius:9px;padding:10px 12px;font-size:12px}.ok{color:#a9d6b5}.fail{color:#e5a7a7}</style></head>
<body><aside><h1>TopoSpace Studio</h1><div class="muted">Coding Agent Topology Debugger · v0.5</div><div class="timeline"><b>Execution timeline</b><div id="steps"></div></div><div class="muted" style="margin-top:18px">Live runtime</div><div id="live" class="badge">offline trace</div></aside><main><div class="topbar"><b id="title">Coding context</b><br><span id="summary" class="muted"></span></div><svg id="canvas" viewBox="0 0 1000 760"></svg></main><aside class="right"><h1>Run Inspector</h1><div id="inspect" class="muted">Loading benchmark trace…</div></aside>
<script>
const fallback={task:'Fix authentication token comparison security vulnerability',result:{baseline:[{success:false,steps:3,files_read:1,tool_calls:3,context_objects:8,context_chars:612,latency_ms:1600},[]],topospace:[{success:true,steps:3,files_read:1,tool_calls:3,context_objects:8,context_chars:580,latency_ms:1600},[{kind:'read',path:'app/auth.py'},{kind:'patched',path:'app/auth.py',ok:true},{kind:'test',code:0}] ]}};
let data=fallback,active=0;const svg=document.getElementById('canvas'),NS='http://www.w3.org/2000/svg';function E(t,a){let e=document.createElementNS(NS,t);Object.entries(a||{}).forEach(([k,v])=>e.setAttribute(k,v));return e}
function render(){let obs=data.result.topospace[1]||[];let steps=[{kind:'context',path:'task/current'},...obs];let box=document.getElementById('steps');box.innerHTML='';steps.forEach((s,i)=>{let d=document.createElement('div');d.className='step '+(i===active?'active':'');d.textContent=(i+1)+'. '+s.kind+(s.path?' · '+s.path:'');d.onclick=()=>{active=i;render()};box.appendChild(d)});draw(steps[active],obs);inspect()}
function draw(step,obs){svg.innerHTML='';let nodes=[{id:'Task',x:500,y:360,type:'STATE'}];let paths=[...new Set(obs.map(x=>x.path).filter(Boolean))];['app/auth.py','tests/test_auth.py','tests/test_security.py','app/layout.py','app/decoy_0.py'].forEach(p=>{if(!paths.includes(p))paths.push(p)});paths=paths.slice(0,7);paths.forEach((p,i)=>{let a=(Math.PI*2*i/paths.length)-Math.PI/2;nodes.push({id:p,x:500+260*Math.cos(a),y:360+230*Math.sin(a),type:p===step.path?'ACTIVE':'CODE'})});nodes.slice(1).forEach(n=>{let l=E('line',{x1:500,y1:360,x2:n.x,y2:n.y,class:'edge '+(n.type==='ACTIVE'?'':'inactive')});svg.appendChild(l)});nodes.forEach(n=>{let g=E('g',{class:'node '+(n.type==='ACTIVE'||n.type==='STATE'?'':'inactive')});let c=E('circle',{cx:n.x,cy:n.y,r:n.type==='STATE'?30:24,fill:n.type==='STATE'?'#fff':n.type==='ACTIVE'?'#aab8c7':'#52687d'});let t=E('text',{x:n.x,y:n.y+45,'text-anchor':'middle'});t.textContent=n.id;g.append(c,t);svg.appendChild(g)});document.getElementById('summary').textContent=step.kind+(step.path?' · '+step.path:'')}
function inspect(){let b=data.result.baseline[0],t=data.result.topospace[0];document.getElementById('inspect').innerHTML=`<div style="margin-top:15px"><span class="badge">E2E regression</span><h2 style="font-size:16px">${data.task}</h2><div class="metric"><span>Baseline success</span><b class="${b.success?'ok':'fail'}">${b.success}</b><span>TopoSpace success</span><b class="${t.success?'ok':'fail'}">${t.success}</b><span>Context objects</span><b>${t.context_objects}</b><span>Context chars</span><b>${t.context_chars}</b><span>Files read</span><b>${t.files_read}</b><span>Tool calls</span><b>${t.tool_calls}</b><span>Latency</span><b>${Math.round(t.latency_ms)} ms</b></div><p class="muted">This is a deterministic regression fixture, not a general coding benchmark claim.</p></div>`}
fetch('data/coding_agent_trace.json').then(r=>r.ok?r.json():Promise.reject()).then(x=>{data=x;render()}).catch(()=>render());
try{const es=new EventSource('http://127.0.0.1:8765/events');es.onopen=()=>document.getElementById('live').textContent='SSE connected';es.addEventListener('agent.action',e=>{document.getElementById('live').textContent='live · agent.action'});}catch(e){}
</script></body></html>
