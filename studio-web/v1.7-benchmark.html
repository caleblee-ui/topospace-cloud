<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopoSpace Benchmark v1.7</title>
<style>body{margin:0;background:#070c16;color:#eef4ff;font-family:Inter,system-ui}main{max-width:1150px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#121c30;border:1px solid #2b3b58;border-radius:14px;padding:18px}.n{font-size:32px;font-weight:750}.sub{color:#9dacbf}.claim{margin-top:16px;padding:16px;border:1px solid #425678;border-radius:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>TopoSpace v1.7 · A/B Benchmark Observatory</h1><p class="sub">Only externally measured, reproducible runs should be used for public marketing claims.</p>
<div class="grid"><div class="card"><div class="sub">Input token reduction</div><div class="n" id="tok">—</div></div><div class="card"><div class="sub">Cost reduction</div><div class="n" id="cost">—</div></div><div class="card"><div class="sub">Success Δ</div><div class="n" id="success">—</div></div><div class="card"><div class="sub">Tool calls</div><div class="n" id="tools">—</div></div><div class="card"><div class="sub">Agent invocations</div><div class="n" id="agents">—</div></div><div class="card"><div class="sub">Latency</div><div class="n" id="lat">—</div></div></div><div class="claim" id="claim">Load a benchmark summary JSON.</div>
<script>window.renderAB=s=>{const m=s.metrics;tok.textContent=m.input_tokens.reduction_pct_mean.toFixed(1)+"%";cost.textContent=m.cost_usd.reduction_pct_mean.toFixed(1)+"%";success.textContent=(s.success.delta_pp_mean>=0?"+":"")+s.success.delta_pp_mean.toFixed(1)+"pp";tools.textContent=m.tool_calls.reduction_pct_mean.toFixed(1)+"%";agents.textContent=m.agent_invocations.reduction_pct_mean.toFixed(1)+"%";lat.textContent=m.latency_ms.reduction_pct_mean.toFixed(1)+"%";claim.textContent=(s.claim_input&&s.claim_input.claim)||"No claim";};</script></main></body></html>
