<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopoSpace Efficiency v1.6</title>
<style>body{margin:0;background:#070c16;color:#eef4ff;font-family:Inter,system-ui}main{max-width:1100px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#121c30;border:1px solid #2b3b58;border-radius:14px;padding:18px}.n{font-size:34px;font-weight:750}.sub{color:#9dacbf}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>TopoSpace v1.6 · Efficiency Observatory</h1><p class="sub">Display benchmark-derived values only. Synthetic fixtures must be labeled.</p>
<div class="grid"><div class="card"><div class="sub">Token Reduction</div><div class="n" id="token">—</div></div><div class="card"><div class="sub">LLM Cost Reduction</div><div class="n" id="cost">—</div></div><div class="card"><div class="sub">Agent Invocations</div><div class="n" id="agents">—</div></div><div class="card"><div class="sub">Tool Calls</div><div class="n" id="tools">—</div></div><div class="card"><div class="sub">Latency</div><div class="n" id="latency">—</div></div><div class="card"><div class="sub">Success Δ</div><div class="n" id="success">—</div></div></div>
<script>window.renderTopoEfficiency=r=>{token.textContent=r.token_reduction_pct.toFixed(1)+"%";cost.textContent=r.cost_reduction_pct.toFixed(1)+"%";agents.textContent="-"+r.agent_invocation_reduction_pct.toFixed(1)+"%";tools.textContent="-"+r.tool_call_reduction_pct.toFixed(1)+"%";latency.textContent="-"+r.latency_reduction_pct.toFixed(1)+"%";success.textContent=(r.success_delta_pp>=0?"+":"")+r.success_delta_pp.toFixed(1)+"pp";};</script></main></body></html>
